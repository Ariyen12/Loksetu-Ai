<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LokSetu AI - Open-Domain Gemini & ChatGPT Multilingual AI">

  <!-- Cache Control to prevent browser from caching old builds -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LokSetu AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LokSetu AI</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Force unregister stale service worker to ensure latest code loads
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Gemini & ChatGPT Ultra-Realistic Sentence-Chunked Voice Engine
    window.LokSetuVoiceEngine = {
      voices: [],
      isSpeaking: false,
      init: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => {
            this.voices = window.speechSynthesis.getVoices();
          };
          this.voices = window.speechSynthesis.getVoices();
        }
      },
      speakText: function(text, langCode) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        this.isSpeaking = true;

        // Clean text: Strip emojis, markdown, raw numbers
        let cleaned = text
          .replace(/[\u{1F300}-\u{1F9FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F900}-\u{1F9FF}]|[\u{1F1E6}-\u{1F1FF}]/gu, '')
          .replace(/₹/g, ' rupees ')
          .replace(/\n1\. /g, '. First, ')
          .replace(/\n2\. /g, '. Second, ')
          .replace(/\n3\. /g, '. Third, ')
          .replace(/\n4\. /g, '. Fourth, ')
          .replace(/• /g, '. ')
          .replace(/\n/g, '. ')
          .replace(/[\*\#\_\~`\[\]\(\)]/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        if (!cleaned) return;

        // Split text into natural conversational sentence chunks for human-like rhythm
        let sentences = cleaned.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);
        if (sentences.length === 0) sentences = [cleaned];

        let targetLang = langCode || 'hi-IN';
        if (!this.voices || this.voices.length === 0) {
          this.voices = window.speechSynthesis.getVoices();
        }

        // Search for natural neural human voice (Google, Natural, Neural)
        let langPrefix = targetLang.split('-')[0];
        let bestVoice = this.voices.find(v => v.lang.startsWith(langPrefix) && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Neural')));
        if (!bestVoice) {
          bestVoice = this.voices.find(v => v.lang.startsWith(langPrefix));
        }

        let index = 0;
        let speakNextChunk = () => {
          if (!this.isSpeaking || index >= sentences.length) {
            this.isSpeaking = false;
            return;
          }
          let chunk = sentences[index++];
          let utterance = new SpeechSynthesisUtterance(chunk);
          if (bestVoice) utterance.voice = bestVoice;
          utterance.rate = 0.92; // Human conversational tempo
          utterance.pitch = 1.0;
          utterance.onend = () => {
            if (this.isSpeaking) {
              setTimeout(speakNextChunk, 80);
            }
          };
          utterance.onerror = () => {
            if (this.isSpeaking) {
              setTimeout(speakNextChunk, 80);
            }
          };
          window.speechSynthesis.speak(utterance);
        };

        speakNextChunk();
      },
      stopSpeech: function() {
        this.isSpeaking = false;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    };
    window.LokSetuVoiceEngine.init();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
