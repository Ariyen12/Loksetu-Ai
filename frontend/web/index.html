<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LokSetu AI - Multilingual Citizen & Farmer Platform">

  <!-- Cache Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LokSetu AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LokSetu AI</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Force unregister stale service worker to ensure latest code loads
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // LokSetu Sweet & Natural Human Voice Engine (No Robotic Reading / No "Dot" Reading)
    window.LokSetuVoiceEngine = {
      voices: [],
      isSpeaking: false,
      init: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => {
            this.voices = window.speechSynthesis.getVoices();
          };
          this.voices = window.speechSynthesis.getVoices();
        }
      },
      speakText: function(text, langCode) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        this.isSpeaking = true;

        // 1. Remove Emojis
        let cleaned = text.replace(/[\u{1F300}-\u{1F9FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F900}-\u{1F9FF}]|[\u{1F1E6}-\u{1F1FF}]/gu, '');
        
        // 2. Replace bullet numbers & currency
        cleaned = cleaned.replace(/₹/g, ' rupees ');
        cleaned = cleaned.replace(/1\. /g, ' First ');
        cleaned = cleaned.replace(/2\. /g, ' Second ');
        cleaned = cleaned.replace(/3\. /g, ' Third ');
        cleaned = cleaned.replace(/4\. /g, ' Fourth ');

        // 3. REMOVE ALL PUNCTUATION MARKS SO TTS NEVER READS "DOT" OR "PERIOD"
        cleaned = cleaned.replace(/[\.\,\:\;\-\*\#\_\~`\[\]\(\)\?\!\"\'\/\\]/g, ' ');
        cleaned = cleaned.replace(/\s+/g, ' ').trim();

        if (!cleaned) return;

        const utterance = new SpeechSynthesisUtterance(cleaned);
        let targetLang = langCode || 'hi-IN';

        if (!this.voices || this.voices.length === 0) {
          this.voices = window.speechSynthesis.getVoices();
        }

        let langPrefix = targetLang.split('-')[0];
        // Select sweet female / natural voice
        let bestVoice = this.voices.find(v => v.lang.startsWith(langPrefix) && (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Neural')));
        if (!bestVoice) {
          bestVoice = this.voices.find(v => v.lang.startsWith(langPrefix));
        }

        if (bestVoice) utterance.voice = bestVoice;
        utterance.rate = 0.88; // Sweet, gentle human pace
        utterance.pitch = 1.05; // Warm, sweet human pitch

        utterance.onend = () => { this.isSpeaking = false; };
        utterance.onerror = () => { this.isSpeaking = false; };

        window.speechSynthesis.speak(utterance);
      },
      stopSpeech: function() {
        this.isSpeaking = false;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    };
    window.LokSetuVoiceEngine.init();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
